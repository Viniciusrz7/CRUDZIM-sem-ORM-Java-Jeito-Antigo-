<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Produto</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 p-10">
<div class="max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-xl">
    <h2 class="text-2xl font-bold text-green-600 mb-6"
        th:text="${produto.id == null ? 'Cadastrar Produto' : 'Editar Produto'}"></h2>

    <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post" class="space-y-5">

        <!-- ID OCULTO -->
        <input type="hidden" th:field="*{id}">

        <div>
            <label class="block text-sm font-semibold text-gray-600">Nome do Produto</label>
            <input type="text" th:field="*{nome}" required
                   class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
        </div>

        <div>
            <label class="block text-sm font-semibold text-gray-600">Preço (R$)</label>
            <input type="number" step="0.01" th:field="*{valor}" required
                   class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
        </div>

        <div class="flex justify-end space-x-3 pt-4">
            <a href="/produtos" class="px-4 py-2 text-gray-500 hover:underline transition">Cancelar</a>
            <button type="submit" class="bg-green-600 text-white px-6 py-2 rounded-lg hover:bg-green-700 shadow-md transition">
                Salvar Produto
            </button>
        </div>
    </form>
</div>
</body>
</html>
