<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestão de Pessoas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 p-8">
<div class="max-w-5xl mx-auto">
    <div class="bg-white shadow-lg rounded-xl p-6">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-bold text-blue-600">Gestão de Pessoas</h2>
            <div class="space-x-2">
                <a href="/produtos" class="px-4 py-2 border border-gray-300 rounded-lg text-gray-600 hover:bg-gray-50 transition">Ver Produtos</a>
                <a href="/pessoas/novo" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition shadow-md">+ Nova Pessoa</a>
            </div>
        </div>

        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse">
                <thead>
                <tr class="bg-gray-800 text-white">
                    <th class="p-4 rounded-tl-lg">ID</th>
                    <th class="p-4">Nome</th>
                    <th class="p-4">Total em Produtos</th>
                    <th class="p-4 rounded-tr-lg">Média</th>
                </tr>
                </thead>
                <tbody class="divide-y divide-gray-200">
                <tr th:each="p : ${pessoas}" class="hover:bg-blue-50 transition">
                    <td class="p-4 text-gray-700" th:text="${p.id}"></td>
                    <td class="p-4 font-semibold text-gray-900" th:text="${p.nome}"></td>
                    <td class="p-4 text-green-600 font-medium" th:text="${'R$ ' + p.totalProdutos}"></td>
                    <td class="p-4 text-gray-600" th:text="${'R$ ' + p.mediaPreco}"></td>
                </tr>
                <tr th:if="${#lists.isEmpty(pessoas)}">
                    <td colspan="4" class="p-8 text-center text-gray-400 italic">Nenhuma pessoa cadastrada.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
