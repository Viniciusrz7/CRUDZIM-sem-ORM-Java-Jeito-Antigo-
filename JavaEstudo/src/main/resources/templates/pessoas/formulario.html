<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Pessoa</title>
    <!-- Tailwind v4 -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-100 p-10">
<div class="max-w-xl mx-auto bg-white p-8 rounded-2xl shadow-xl">
    <h2 class="text-2xl font-bold text-gray-800 mb-6"
        th:text="${pessoa.id == null ? 'Cadastrar Nova Pessoa' : 'Editar Pessoa'}"></h2>

    <form th:action="@{/pessoas/salvar}" th:object="${pessoa}" method="post" class="space-y-5">

        <!-- ID OCULTO -->
        <input type="hidden" th:field="*{id}">

        <!-- Nome -->
        <div>
            <label class="block text-sm font-semibold text-gray-600">Nome Completo</label>
            <input type="text" th:field="*{nome}" required
                   class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <!-- Idade e Peso -->
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-semibold text-gray-600">Idade</label>
                <input type="number" th:field="*{idade}"
                       class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-600">Peso (kg)</label>
                <input type="number" step="0.1" th:field="*{peso}"
                       class="w-full mt-1 p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
            </div>
        </div>

        <!-- VINCULAR PRODUTOS -->
        <div class="mt-6">
            <label class="block text-sm font-bold text-gray-700 mb-2">Vincular Produtos:</label>
            <div class="grid grid-cols-1 gap-1 p-3 border rounded-lg bg-gray-50 max-h-48 overflow-y-auto shadow-inner">

                <div th:each="prod : ${todosProdutos}" class="flex items-center p-2 hover:bg-white rounded-md transition group">
                    <input type="checkbox"
                           th:value="${prod.id}"
                           name="produtosSelecionados"
                           th:checked="${pessoa.produtos != null && #sets.contains(pessoa.produtos.![id], prod.id)}"
                           class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500 cursor-pointer">

                    <label class="ml-3 text-sm text-gray-700 cursor-pointer group-hover:text-blue-600 transition"
                           th:text="${prod.nome + ' - R$ ' + prod.valor}"></label>
                </div>

                <!-- Mensagem caso não existam produtos cadastrados -->
                <div th:if="${#lists.isEmpty(todosProdutos)}" class="text-xs text-gray-400 text-center py-4">
                    Nenhum produto disponível no estoque.
                </div>
            </div>
        </div>

        <!-- BOTÕES DE AÇÃO -->
        <div class="flex justify-end space-x-3 pt-6 border-t mt-4">
            <a href="/pessoas" class="px-4 py-2 text-gray-500 hover:text-gray-800 transition">Cancelar</a>
            <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 shadow-md transition transform active:scale-95">
                Salvar Registro
            </button>
        </div>
    </form>
</div>

<!-- Script opcional para fechar o alerta de erro se você implementar no futuro -->
</body>
</html>
